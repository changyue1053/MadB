language = "C"
include_guard = "MADB_FIRST_ROUTE_ENGINE_H"
autogen_warning = "/* Generated by locked cbindgen from the C05 Rust exports. Do not edit. */"
style = "type"
usize_is_size_t = true
cpp_compat = true

[export]
exclude = [
    "MadbTestCounts",
    "madb_fixture_test_arm",
    "madb_fixture_test_wait",
    "madb_fixture_test_resume",
    "madb_fixture_test_snapshot",
    "madb_fixture_test_emit",
    "madb_fixture_test_set_fault",
    "madb_fixture_test_set_next_token",
]
