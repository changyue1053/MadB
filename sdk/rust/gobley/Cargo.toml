[package]
name = "madb-boundary-gobley"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
[lib]
name = "madb_boundary_gobley"
path = "../uniffi/src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]
[workspace]
[features]
default = ["gobley-029"]
gobley-029 = []
test-support = []
[[bin]]
name = "madb-gobley-metadata"
path = "../uniffi/src/bin/madb-uniffi-metadata.rs"
[dependencies]
uniffi_bindgen = "=0.29.4"
serde_json = "=1.0.154"
madb-boundary-core = { path = "../boundary-core" }
uniffi = "=0.29.4"
async-trait = "=0.1.89"
[build-dependencies]
uniffi = { version = "=0.29.4", features = ["build"] }
