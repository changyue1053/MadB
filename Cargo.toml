[workspace]
members = [
    "crates/madb-cli",
    "crates/madb-app",
    "crates/madb-model",
    "crates/madb-rules",
    "crates/madb-plan",
    "crates/madb-protocol",
]
resolver = "3"

[workspace.package]
version = "0.1.0-dev.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false
repository = "https://github.com/changyue1053/MadB"

[workspace.dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }

[workspace.lints.rust]
unsafe_code = "forbid"
