[workspace]
members = [
    "crates/madb-cli",
    "crates/madb-app",
    "crates/madb-model",
    "crates/madb-rules",
    "crates/madb-plan",
    "crates/madb-protocol",
    "adapters/contracts",
    "adapters/host",
    "adapters/templates",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false
repository = "https://github.com/changyue1053/MadB"

[workspace.dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }

serde = { version = "=1.0.229" }
serde_json = { version = "=1.0.154" }
jsonschema = { version = "=0.60.1", default-features = false }
sha2 = { version = "=0.11.1" }
toml = { version = "=1.1.6", default-features = false, features = ["std", "serde", "parse"] }
madb-app = { path = "crates/madb-app" }
madb-plan = { path = "crates/madb-plan" }
madb-contracts = { path = "adapters/contracts" }
madb-host = { path = "adapters/host" }
madb-templates = { path = "adapters/templates" }
madb-model = { path = "crates/madb-model" }
madb-rules = { path = "crates/madb-rules" }
madb-protocol = { path = "crates/madb-protocol" }

[workspace.lints.rust]
unsafe_code = "forbid"
